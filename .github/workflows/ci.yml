name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests with live diagnostics
        env:
          RUST_BACKTRACE: "1"
        # Run one assembly fixture at a time and identify the active test if it
        # aborts. Scoring-worker tests still run their internal threads.
        run: cargo test --locked --release --all-features -- --test-threads=1 --nocapture
      - name: Collect macOS test crash reports
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import time
          from pathlib import Path

          roots = [Path.home() / "Library/Logs/DiagnosticReports",
                   Path("/Library/Logs/DiagnosticReports")]
          output = Path(os.environ["RUNNER_TEMP"]) / "mitovarr-crash-reports"
          output.mkdir(exist_ok=True)
          for attempt in range(6):
              reports = [p for root in roots for p in root.glob("*")
                         if p.is_file() and p.suffix in {".ips", ".crash"}
                         and p.name.startswith(("mapping_local-", "native_", "mitovarr-"))]
              if reports:
                  for index, report in enumerate(reports):
                      shutil.copy2(report, output / f"{index}-{report.name}")
                      print(f"Crash report: {report.name}", flush=True)
                      print(report.read_text(errors="replace")[:60000], flush=True)
                  break
              if attempt < 5:
                  time.sleep(5)
          else:
              print("No mitovarr macOS crash report was produced.")
          PY
      - name: Preserve macOS crash reports
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-test-crash-reports
          path: ${{ runner.temp }}/mitovarr-crash-reports/
          if-no-files-found: ignore
      - name: Verify the standalone Cargo source package
        if: matrix.os == 'ubuntu-22.04'
        run: cargo package --locked
